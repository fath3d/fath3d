name: Jarvis Step 8 isolated stock validation

on:
  push:
    branches:
      - test-step8-stock-validation

permissions:
  contents: read

concurrency:
  group: jarvis-step8-stock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    if: github.ref == 'refs/heads/test-step8-stock-validation'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Assert test branch and unchanged production base
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/test-step8-stock-validation"
          git fetch --no-tags origin main
          expected_main=a1075928e0b35450ac0af74ace4c2c9b56562311
          test "$(git rev-parse origin/main)" = "$expected_main"
          test "$(git merge-base HEAD origin/main)" = "$expected_main"
          workflow_count=$(find .github/workflows -maxdepth 1 -type f | wc -l)
          test "$workflow_count" -eq 1
          grep -Fq 'branches:' .github/workflows/test-step8-stock-validation.yml

  functional:
    needs: preflight
    if: github.ref == 'refs/heads/test-step8-stock-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Extract isolated validation payload
        run: unzip -oq step8-stock-test-payload.zip -d .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify staged files are the isolated test sources
        shell: bash
        run: |
          set -euo pipefail
          test -s manager/index.html
          test -s manager/manager-versioned-persistence.mjs
          test -s work/index.html
          cmp --silent manager/index.html work/index.html
          grep -Fq 'MANAGER_VERSIONED_WRITES_ENABLED = false' manager/index.html
      - name: Run targeted stock, Inventory8, and 9A regressions
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p work/test-results
          status=0
          for suite in \
            work/test_stock_operations_ui_static.js \
            work/test_stock_operations_sendtext.js \
            work/test_stock_versioned_service_mock.js \
            work/test_stock_save_confirmation.js \
            work/test_inventory8_sendtext.js \
            work/test_replenishment_rules_step9a3.js; do
            echo "===== $suite ====="
            node "$suite" 2>&1 | tee -a work/test-results/functional.log || status=1
          done
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: step8-stock-functional-logs
          if-no-files-found: ignore
          path: work/test-results/functional.log

  firestore-emulator:
    needs: preflight
    if: github.ref == 'refs/heads/test-step8-stock-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CI: 'true'
      GCLOUD_PROJECT: demo-manager-versioning-phase1
      GOOGLE_CLOUD_PROJECT: demo-manager-versioning-phase1
      FIREBASE_CLI_DISABLE_UPDATE_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Extract isolated validation payload
        run: unzip -oq step8-stock-test-payload.zip -d .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: work/firestore-validation/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install emulator-only dependencies
        working-directory: work/firestore-validation
        run: npm ci
      - name: Run revision, transfer, count, concurrency and 9A Rules tests in demo emulator
        working-directory: work/firestore-validation
        shell: bash
        run: |
          set -euo pipefail
          unset FIREBASE_TOKEN GOOGLE_APPLICATION_CREDENTIALS FIREBASE_CONFIG
          export FIRESTORE_EMULATOR_HOST=127.0.0.1:8785
          ./node_modules/.bin/firebase emulators:exec \
            --only firestore \
            --project demo-manager-versioning-phase1 \
            --config firebase.json \
            --non-interactive \
            "node manager-versioning.test.cjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: step8-stock-firestore-results
          if-no-files-found: ignore
          path: |
            work/firestore-validation/manager-versioning-results.json
            work/firestore-validation/firestore-debug.log

  playwright-visual:
    needs: preflight
    if: github.ref == 'refs/heads/test-step8-stock-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Extract isolated validation payload
        run: unzip -oq step8-stock-test-payload.zip -d .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test dependencies
        working-directory: work/firestore-validation
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Render 9A and stock transfer UI at desktop, tablet, and phone sizes
        working-directory: work/firestore-validation
        shell: bash
        run: |
          set -euo pipefail
          node prepare-visual-fixture.cjs
          node playwright-9a-smoke.cjs
          node playwright-step8-stock-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: step8-stock-playwright-screenshots
          if-no-files-found: ignore
          path: |
            work/firestore-validation/test-results/*.png

