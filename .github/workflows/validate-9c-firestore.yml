name: Jarvis 9C real Rules validation (protected environment)
on:
  push:
    branches:
      - "work/9c-firestore-validation"
    paths:
      - "validation/9c/trigger/real-rules-validation.txt"
permissions:
  contents: read
concurrency:
  group: jarvis-9c-real-rules-validation
  cancel-in-progress: false
jobs:
  firestore-emulator:
    if: github.ref == 'refs/heads/work/9c-firestore-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: jarvis-9c-validation
    permissions:
      contents: read
    steps:
      - name: Checkout isolated validation branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node.js 24.12.0
        uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"
      - name: Setup Java 21 for Firestore Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install pinned isolated test dependencies
        run: npm install --no-audit --no-fund --package-lock=false
        working-directory: validation/9c
      - name: Install Chromium for isolated candidate UI check
        run: npx playwright install --with-deps chromium
        working-directory: validation/9c
      - name: Reconstruct and verify exact candidate in runner temporary storage
        run: |
          set -euo pipefail
          candidate_dir="$RUNNER_TEMP/jarvis-9c-candidate"
          mkdir -p "$candidate_dir/manager"
          cp manager/index.html "$candidate_dir/manager/index.html"
          patch --batch --forward --fuzz=0 -p1 -d "$candidate_dir" < validation/9c/candidate-manager-9c.patch
          node -e 'const fs=require("node:fs"),p=process.argv[1],s=fs.readFileSync(p,"utf8");fs.writeFileSync(p,s.replace(/\r?\n/g,"\r\n"));' "$candidate_dir/manager/index.html"
          actual="$(sha256sum "$candidate_dir/manager/index.html" | cut -d ' ' -f1 | tr '[:lower:]' '[:upper:]')"
          test "$actual" = "C5E7321F359835B048FB8C81D7A943555B3345E6665226693D57B28DEB897B76"
          printf 'JARVIS_9C_CANDIDATE_PATH=%s\n' "$candidate_dir/manager/index.html" >> "$GITHUB_ENV"
      - name: Prepare exact deployed Rules and the single 9C addition in runner temp
        working-directory: validation/9c
        env:
          GCLOUD_PROJECT: "demo-jarvis-replenishment-9c"
          JARVIS_9C_RULES_TEMP: ${{ secrets.JARVIS_9C_RULES_TEMP }}
        run: node scripts/prepare-real-rules.cjs
      - name: Run one isolated real-Rules emulator campaign
        working-directory: validation/9c
        env:
          FIREBASE_CLI_DISABLE_UPDATE_CHECK: "true"
          FIRESTORE_EMULATOR_HOST: "127.0.0.1:8785"
          GCLOUD_PROJECT: "demo-jarvis-replenishment-9c"
          GOOGLE_CLOUD_PROJECT: "demo-jarvis-replenishment-9c"
        run: |
          set +e
          test_command='set +e
          node scripts/compile-real-rules.cjs > "$RUNNER_TEMP/9c-real-compile.log" 2>&1
          c=$?
          if [ "$c" -eq 0 ]; then
            node firestore-validation/replenishment-decisions-9c.test.cjs > "$RUNNER_TEMP/9c-decisions.log" 2>&1
            a=$?
            node firestore-validation/candidate-manager-9c-ui.test.cjs > "$RUNNER_TEMP/9c-ui.log" 2>&1
            b=$?
          else
            a=125
            b=125
          fi
          printf "%s %s %s\n" "$c" "$a" "$b" > "$RUNNER_TEMP/9c-test-exit-codes"
          test "$c" -eq 0 -a "$a" -eq 0 -a "$b" -eq 0'
          npx firebase-tools emulators:exec --only firestore --project demo-jarvis-replenishment-9c --config "$JARVIS_9C_FIREBASE_CONFIG" "$test_command" > "$RUNNER_TEMP/9c-real-emulator-cli.log" 2>&1
          emulator_exit=$?
          node scripts/summarize-real-rules-results.cjs "$emulator_exit"
          summary_exit=$?
          if [ "$emulator_exit" -ne 0 ] || [ "$summary_exit" -ne 0 ]; then exit 1; fi
      - name: Remove real Rules, candidate, reports, and temporary logs
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/jarvis-9c-real-baseline.rules" \
            "$RUNNER_TEMP/jarvis-9c-real-combined.rules" \
            "$RUNNER_TEMP/jarvis-9c-real-firebase.json" \
            "$RUNNER_TEMP/9c-real-rules-compile-results.json" \
            "$RUNNER_TEMP/9c-decisions-results.json" \
            "$RUNNER_TEMP/9c-candidate-ui-results.json" \
            "$RUNNER_TEMP/9c-real-compile.log" \
            "$RUNNER_TEMP/9c-decisions.log" \
            "$RUNNER_TEMP/9c-ui.log" \
            "$RUNNER_TEMP/9c-real-emulator-cli.log" \
            "$RUNNER_TEMP/9c-test-exit-codes"
          rm -rf "$RUNNER_TEMP/jarvis-9c-candidate"
